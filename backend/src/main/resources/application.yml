server:

  port: ${SERVER_PORT:8080}

  servlet:

    context-path: /



spring:

  application:

    name: autoscientist-backend

  profiles:

    active: ${SPRING_PROFILES_ACTIVE:dev}



  servlet:

    multipart:

      max-file-size: 50MB

      max-request-size: 50MB



  jpa:

    open-in-view: false

    show-sql: ${SPRING_JPA_SHOW_SQL:false}

    properties:

      hibernate:

        format_sql: true



app:

  jwt:

    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

  upload:

    dir: ${FILE_UPLOAD_DIR:./uploads/datasets}



---

spring:

  config:

    activate:

      on-profile: mysql

  datasource:

    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/autoscientist_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}

    username: ${SPRING_DATASOURCE_USERNAME:root}

    password: ${SPRING_DATASOURCE_PASSWORD:root}

    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:

    hibernate:

      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

    database-platform: org.hibernate.dialect.MySQLDialect



---

spring:

  config:

    activate:

      on-profile: dev

  datasource:

    url: jdbc:h2:mem:autoscientist_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL

    driver-class-name: org.h2.Driver

    username: sa

    password:

  jpa:

    hibernate:

      ddl-auto: create-drop

    database-platform: org.hibernate.dialect.H2Dialect

  h2:

    console:

      enabled: true

      path: /h2-console
